; =============================================================================
;  SROT ground station — the ESP32-C3 LoRa ↔ MAVLink bridge (ONE env)
;    env:groundstation-esp32  → src/groundstation/
;
;  Flash:  pio run -t upload
;          pio run -t monitor
;  In VSCode PlatformIO, pick the env in the status-bar dropdown, then Upload.
;
;  The desktop GCS half of this repo (Bondor, Electron + React) is NOT built by
;  PlatformIO — see bondor/ and the README.
;
;  NOTE: shared/lora_telem_proto.h and lib/mavlink/ are DUPLICATED from
;  RakibulIslam1/srot-control-board. Read the banner at the top of
;  shared/lora_telem_proto.h before changing either.
; =============================================================================

[platformio]
default_envs = groundstation-esp32

; -------- Ground station (2nd ESP32) — LoRa → MAVLink bridge ------------------
; An ESP32-C3 with an SX127x wired like the control board. Receives the SROT
; black-box telemetry frame and re-emits MAVLink over USB, so Bondor (or QGC)
; connects to it as a normal serial link.
[env:groundstation-esp32]
platform = espressif32@^6.9.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<groundstation/>
build_flags =
    ; The LoRa telemetry frame — must match the control board byte-for-byte.
    -I shared
    ; Vendored MAVLink v2 headers (common + ardupilotmega dialect).
    -I lib/mavlink
    -I lib/mavlink/ardupilotmega
    -D MAVLINK_COMM_NUM_BUFFERS=2
    -D CORE_DEBUG_LEVEL=0
    ; The C3 has no USB-UART bridge chip — talk over native USB CDC.
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    sandeepmistry/LoRa
